                "@type": "Question",
                "name": "Do staff need their own logins?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — and that's the point. Every temperature check, refusal and check-in is recorded against the person who did it, so records stand up to scrutiny. Invite staff by email and they're set up in minutes; there's no per-record cost for adding people."

              },

                "@type": "Question",
                "name": "Does it work on any phone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The companion app runs on both iOS and Android, including older and budget handsets — staff can use their own phones or a shared shop device. Owners and managers get the full web portal in any modern browser."
                }
              },
              {
                "@type": "Question",
                "name": "What happens after the 14-day trial?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "If you'd like to keep going, choose a plan in your account portal and subscribe online. If not, your account simply pauses — we don't take card details up front, so there's nothing to cancel and no surprise charge."
                }
              },
              {
                "@type": "Question",
                "name": "Can I turn modules off?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Modules are enabled per shop, so a forecourt can run temperature logs and safe drops while an off-licence focuses on refusals and scratch cards. Staff only see the modules their shop uses."
                }
              },
              {
                "@type": "Question",
                "name": "Is my data backed up?",

              },
